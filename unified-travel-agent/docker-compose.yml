services:
  postgres:
    image: postgres:16-alpine
    container_name: travel_agent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: travel_agent
      POSTGRES_PASSWORD: travel_agent_dev_password
      POSTGRES_DB: travel_agent
    ports:
      - "5432:5432"
    volumes:
      - travel_agent_pgdata:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_agent -d travel_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  travel_agent_pgdata:
